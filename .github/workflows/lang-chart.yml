name: Language chart

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:        # manual run via the Actions tab
  push:
    paths:
      - scripts/lang_chart.py
      - .github/workflows/lang-chart.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANG_TOKEN: ${{ secrets.LANG_TOKEN }}   # optional: includes private repos
          GH_USER: ${{ github.repository_owner }}
          TOP_N: "5"
          EXCLUDE_LANGS: ""        # e.g. "Jupyter Notebook,Dockerfile"
          EXCLUDE_REPOS: ""        # e.g. "some-old-repo"
        run: python scripts/lang_chart.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/langs-light.svg assets/langs-dark.svg
          git diff --cached --quiet || (git commit -m "Update language chart" && git push)
